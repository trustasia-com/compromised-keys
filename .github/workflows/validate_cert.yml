name: Validate Certificate Submission

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: certificate-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'cert-submission')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPROMISED_KEYS_DB: /tmp/compromised_keys.db
      VALIDATION_RESULT: /tmp/validation-result.txt

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Parse certificate from issue body
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re

          body = os.environ.get("ISSUE_BODY", "")
          match = re.search(
              r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----",
              body,
              re.DOTALL,
          )
          if match:
              with open("/tmp/cert.pem", "w", encoding="utf-8") as stream:
                  stream.write(match.group(0))
              print("found=true")
          else:
              print("found=false")
          PY

      - name: Install package
        if: steps.parse.outputs.found == 'true'
        run: python -m pip install ".[release]"

      - name: Restore current data release
        if: steps.parse.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/data-release
          gh release download data-latest \
            --pattern compromised_keys.db.zst \
            --pattern db-manifest.json \
            --pattern SHA256SUMS \
            --dir /tmp/data-release
          compromised-keys restore-release \
            --asset-dir /tmp/data-release \
            --output "$COMPROMISED_KEYS_DB"

      - name: Validate certificate
        if: steps.parse.outputs.found == 'true'
        id: validate
        run: |
          set +e
          compromised-keys validate-cert /tmp/cert.pem > "$VALIDATION_RESULT" 2>&1
          STATUS=$?
          set -e
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Comment with validation result
        if: steps.parse.outputs.found == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VALIDATION_STATUS: ${{ steps.validate.outputs.status }}
        with:
          script: |
            const fs = require('fs');
            const escapeHtml = (value) => value
              .replaceAll('&', '&amp;')
              .replaceAll('<', '&lt;')
              .replaceAll('>', '&gt;');
            const result = escapeHtml(fs.readFileSync(process.env.VALIDATION_RESULT, 'utf8'));
            const status = process.env.VALIDATION_STATUS === '0' ? 'passed' : 'failed';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Certificate validation ${status}\n\n<pre>${result}</pre>\n\nA maintainer must review valid submissions before production data is changed.`
            });

      - name: Reject submissions without a PEM certificate
        if: steps.parse.outputs.found == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### Invalid submission\n\nNo PEM certificate block was found. Submit a public certificate only; never submit a private key or another secret.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'not_planned'
            });
