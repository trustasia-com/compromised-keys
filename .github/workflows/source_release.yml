name: Source Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish source release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install build tools
        run: python -m pip install -e ".[dev,postgres,release]"

      - name: Validate release source
        run: |
          python -m pytest
          ruff check .
          ruff format --check .
          python -m pip_audit --skip-editable

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["version"]
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(
                  f"Tag {os.environ['RELEASE_TAG']} does not match package version {expected}"
              )
          PY

      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Publish GitHub source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --latest \
            --title "Compromised Keys $GITHUB_REF_NAME" \
            --generate-notes
